name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n devin-rc install.sh uninstall.sh
      - run: shellcheck devin-rc install.sh uninstall.sh
      - name: smoke test
        run: |
          ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          devin-rc help >/dev/null
          devin-rc version | grep -q 'devin-rc'
          SESSION=envsession devin-rc info | grep -q 'session: envsession'
          devin-rc -s test pair ci@100.64.0.1 --wsl --distro Ubuntu-22.04
          devin-rc -s test info | grep -q 'wsl host, distro Ubuntu-22.04'
          SESSION=clienv devin-rc -s flagwins info | grep -q 'session: flagwins'
          bash ./uninstall.sh
          test ! -e "$HOME/.local/bin/devin-rc"
          ! grep -q 'devin-rc' "$HOME/.bashrc"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: smoke test
        shell: pwsh
        run: |
          ./install.ps1 -NoPath
          $rc = "$env:LOCALAPPDATA\devin-rc\bin\devin-rc.cmd"
          & $rc help | Out-Null
          & $rc version
          & $rc pair ci@100.64.0.1 --wsl --distro Ubuntu-22.04
          & $rc info
          ./uninstall.ps1
          if (Test-Path "$env:LOCALAPPDATA\devin-rc") { throw 'uninstall left files behind' }
